name: Push It backend checks

on:
  push:
    branches:
      - main
      - feature/stripe-subscriptions-safe-backend
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check serverless routes
        run: node --check lib/billing.js && node --check lib/billing-validation.js && node --check lib/moov.js && node --check api/moov/status.js && node --check api/billing/checkout.js && node --check api/billing/portal.js && node --check api/billing/status.js && node --check api/billing/webhook.js
      - name: Run unit tests
        run: npm test
